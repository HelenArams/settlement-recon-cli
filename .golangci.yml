run:
  timeout: 3m

linters:
  enable:
    - errorlint
    - gocritic
    - gofmt
    - goimports
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam

linters-settings:
  goimports:
    local-prefixes: github.com/HelenArams/settlement-recon-cli
  revive:
    rules:
      - name: exported
        disabled: true # internal packages, not a public API

issues:
  exclude-rules:
    - path: _test\.go
      linters: [unparam]
